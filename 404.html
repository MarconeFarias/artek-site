<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página não encontrada - ARTEK Elevadores</title>

    <!-- 1. Fonte Barlow -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,700;0,800;1,400&display=swap" rel="stylesheet">

    <!-- 2. Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- 3. AOS CSS (Animações de Scroll) -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <!-- 4. Seu CSS customizado SEMPRE por último -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- Header Global (Injetado via JS) -->
    <div class="hero-404">
    <div id="header-global" class="w-100"></div>

    <!-- Banner Principal 404 -->
    <main class="hero-404 flex-grow-1 d-flex align-items-center justify-content-center text-center">
        <div class="container px-4" data-aos="zoom-in" data-aos-duration="800">
            <h1 class="erro-codigo mb-0">404</h1>
            <h2 class="erro-titulo fw-bold mb-3">Ops! Página não encontrada.</h2>
            <p class="erro-texto mb-5 mx-auto">
                O link que você tentou acessar pode estar quebrado, a página pode ter sido removida ou você digitou o endereço incorretamente.
            </p>
            
            <div class="d-flex justify-content-center gap-3 flex-wrap">
                <!-- Botão Inteligente para voltar -->
                <button onclick="voltarPagina()" class="btn-orcamento d-inline-flex align-items-center gap-2">
                    <span class="fs-5">&#8592;</span> Voltar para onde eu estava
                </button>
            </div>
        </div>
    </main>

    <!-- Footer Global (Injetado via JS) -->
    <div id="footer-global" class="w-100"></div>

    <!-- Script Inteligente de Retorno -->
    <script>
        function voltarPagina() {
            // Verifica se o navegador tem histórico anterior para voltar
            if (window.history.length > 1 && document.referrer !== "") {
                window.history.back();
            } else {
                // Se não houver histórico (ex: abriu em nova guia), força a ida para a Home
                window.location.href = 'index.html';
            }
        }
    </script>

    <!-- Scripts do Bootstrap, AOS e seu Script Principal -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="script.js"></script>
</body>
</html>
