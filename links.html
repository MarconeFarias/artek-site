<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARTEK Elevadores | Links</title>
    
    <!-- Fonte Barlow -->
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons (Mantido apenas para os 3 pontinhos) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        /* Fundo cinza para desktop */
        body {
            font-family: 'Barlow', sans-serif;
            background-color: #b0b0b0; 
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 40px 15px; /* Espaço nas bordas da tela */
        }

        /* Container central branco com bordas arredondadas */
        .profile-container {
            width: 100%;
            max-width: 540px; /* Reduzido para não ficar muito largo */
            background-color: #ffffff;
            border-radius: 32px; /* Curvas do container igual à referência */
            text-align: center;
            padding: 50px 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        /* Topo: Logo e Textos */
        .profile-logo {
            width: 96px;
            height: 96px;
            object-fit: cover;
            border-radius: 50%;
            margin-bottom: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .profile-title {
            font-weight: 700;
            font-size: 1.3rem;
            margin-bottom: 8px;
            color: #000;
        }

        .profile-description {
            font-weight: 400;
            font-size: 0.95rem;
            color: #333;
            margin-bottom: 25px;
        }

        .section-title {
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 24px;
            color: #000;
        }

        /* Botões mais espessos (altos) e arredondados */
        .link-btn {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
            background-color: #ffffff;
            color: #333;
            border: 2px solid #0b3b60; /* Borda Azul ARTEK */
            box-shadow: 5px 5px 0px 0px #0b3b60; /* Sombra dura Azul ARTEK */
            min-height: 72px; /* Deixa o botão mais alto/espesso */
            padding: 10px;
            margin-bottom: 22px;
            border-radius: 60px; /* Curvas máximas nas pontas (Pílula) */
            font-weight: 500;
            font-size: 1rem;
            text-decoration: none;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }

        /* Efeito de apertar o botão */
        .link-btn:hover, .link-btn:active {
            transform: translate(3px, 3px);
            box-shadow: 2px 2px 0px 0px #0b3b60;
            color: #0b3b60;
        }

        /* Container circular para a sua imagem PNG */
        .icon-circle {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            position: absolute;
            left: 8px;
            overflow: hidden; /* Garante que a imagem não vaze do círculo */
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #ffffff;
            border: 1px solid #eaeaea; /* Borda sutil em volta do PNG */
        }

        /* A imagem PNG do ícone */
        .icon-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Ajusta o PNG dentro do círculo */
        }

        /* Texto centralizado */
        .btn-text {
            width: 100%;
            text-align: center;
            padding: 0 45px; /* Libera espaço para o ícone e os 3 pontinhos */
        }

        /* Três pontinhos à direita */
        .dots-icon {
            position: absolute;
            right: 20px;
            font-size: 1.2rem;
            color: #888;
        }

        .footer-brand {
            margin-top: 30px;
            font-size: 0.9rem;
            font-weight: 500;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="profile-container">
        <!-- Seu logo PNG principal -->
        <img src="assets/img/icone-logo-artek-colorido.png" alt="ARTEK Elevadores" class="profile-logo">
        
        <h1 class="profile-title">ARTEK Elevadores</h1>
        <p class="profile-description">Fale direto conosco pelo WhatsApp ou conheça nossos serviços</p>

        <div class="section-title">Nossos canais de comunicação</div>

        <a href="https://instagram.com/artekelevadores" target="_blank" rel="noopener noreferrer" class="link-btn">
            <div class="icon-circle">
                <img src="assets/img/icone-logo-artek-instagram.png" alt="Instagram">
            </div>
            <span class="btn-text">Instagram da ARTEK</span>

        <!-- 5. Facebook -->

            <div class="icon-circle">
                <img src="assets/img/icone-logo-artek-facebook.png" alt="Facebook">
            </div>
            <span class="btn-text">Facebook da ARTEK</span>

        <!-- 6. LinkedIn -->
        <a href="https://www.linkedin.com/company/artek-elevadores" target="_blank" rel="noopener noreferrer" class="link-btn">

        <!-- 7. TikTok -->

            <div class="icon-circle">
                <img src="assets/img/icone-logo-artek-telefone.png" alt="Telefone">
            </div>

            <i class="bi bi-three-dots-vertical dots-icon"></i>
        </a>

        <div class="footer-brand">
            &copy; 2026 ARTEK Elevadores
        </div>
    </div>

</body>
</html>
